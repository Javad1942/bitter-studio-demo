@media (prefers-reduced-motion: no-preference) {
.ring { transform-box: fill-box; transform-origin: center; animation: art-ring 56s linear 1 reverse; }
.orb-surface { transform-box: view-box; transform-origin: center; animation: art-ring 40s linear 1; }
@keyframes art-ring { to { rotate: 1turn } }
.halo { transform-box: fill-box; transform-origin: center; animation: art-halo 7s ease-in-out 3 alternate forwards; }
@keyframes art-halo { from { opacity: .7; scale: .92 } to { opacity: 1; scale: 1.06 } }
}
</style></svg>
