<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" preserveAspectRatio="xMidYMid meet"><rect width="840" height="480" fill="#dbd7cd"/><g class="art-turn"><ellipse transform="rotate(0 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(45 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(90 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(135 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(180 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(225 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(270 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/><ellipse transform="rotate(315 420 240)" cx="420" cy="170" rx="56" ry="87" fill="#b6be85"/></g><circle cx="420" cy="240" r="52" fill="#d2a26e" class="art-glow"/><style>
@media (prefers-reduced-motion: no-preference) {
  .art-turn { transform-box: fill-box; transform-origin: center; animation: art-turn 6s ease-in-out 0s 4 alternate forwards; }
  .art-glow { transform-box: fill-box; transform-origin: center; animation: art-glow 5s ease-in-out 0s 3 alternate forwards; }
