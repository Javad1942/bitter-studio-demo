@media (prefers-reduced-motion: no-preference) {
  .art-glow { transform-box: fill-box; transform-origin: center; animation: art-glow 5s ease-in-out 0s 3 alternate forwards; }
  .art-rise { transform-box: fill-box; transform-origin: center; animation: art-rise 5s ease-out 0s 3 normal forwards; }
  .art-twinkle { transform-box: fill-box; transform-origin: center; animation: art-twinkle 2.4s ease-in-out 0s 3 alternate forwards; }
  .art-sway { transform-box: fill-box; transform-origin: center bottom; animation: art-sway 5.4s ease-in-out -1.7s 4 alternate forwards; }
  @keyframes art-glow {
  0% { opacity: 0.25; }
  100% { opacity: 1; }
}
  @keyframes art-rise {
  0% { opacity: 0; translate: 0px 6px; scale: 0.8; }
  30% { opacity: 0.8; }
  100% { opacity: 0; translate: 6px -46px; scale: 1.5; }
